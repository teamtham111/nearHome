# NearHome production backend, worker, Postgres, and Redis-compatible Key Value.
# Frontend deployment is intentionally on Vercel; see docs/DEPLOYMENT.md.
previews:
  generation: manual

databases:
  - name: nearhome-postgres
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
    databaseName: nearhome
    user: nearhome

services:
  - type: keyvalue
    name: nearhome-redis
    plan: starter
    region: singapore
    maxmemoryPolicy: allkeys-lru
    persistenceMode: journal-snapshot
    ipAllowList: []

  - type: web
    name: nearhome-api
    runtime: docker
    plan: standard
    region: singapore
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/ready
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: nearhome-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nearhome-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: ONEMAP_EMAIL
        sync: false
      - key: ONEMAP_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATA_GOV_SG_API_KEY
        sync: false
      - key: LTA_ACCOUNT_KEY
        sync: false

  - type: worker
    name: nearhome-worker
    runtime: docker
    plan: standard
    region: singapore
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    dockerCommand: python -m app.jobs.worker
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: nearhome-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nearhome-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: nearhome-api
          envVarKey: SECRET_KEY
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: ONEMAP_EMAIL
        sync: false
      - key: ONEMAP_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATA_GOV_SG_API_KEY
        sync: false
      - key: LTA_ACCOUNT_KEY
        sync: false
