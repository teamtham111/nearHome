[project]
name = "nearhome-api"
version = "0.1.0"
description = "NearHome decision-support API for Singapore HDB resale buyers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.28.0",
    "groq>=1.6.0",
    "pandas>=2.2.0",
    "catboost>=1.2.0",
    "redis>=5.2.0",
    "arq>=0.26.0",
    "python-multipart>=0.0.17",
    "python-dateutil>=2.9.0",
    "structlog>=24.4.0",
    "playwright>=1.48.0",
    "pyproj>=3.7.0",
    "shapely>=2.0.0",
    "osmnx>=2.0.0",
    "google-cloud-tasks>=2.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "scikit-learn>=1.5.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-python-dateutil>=2.9.0",
]
evaluation = [
    "scikit-learn>=1.5.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E741"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
