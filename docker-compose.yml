services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nearhome
      POSTGRES_PASSWORD: nearhome
      POSTGRES_DB: nearhome
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nearhome -d nearhome"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://nearhome:nearhome@postgres:5432/nearhome
      # Use the queued worker locally so the browser receives a job ID
      # immediately and can show real stage progress while enrichment runs.
      JOB_EXECUTION_MODE: arq
      REDIS_URL: redis://redis:6379/0
      # The root .env can point a direct host-Python run at its locally trained
      # artifact. Containers must instead use the immutable artifact built
      # into the API image.
      FAIR_PRICE_MODEL_ARTIFACT_PATH: /app/model-artifacts/fair-price
    ports:
      - "8000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./data_pipeline:/app/data_pipeline
      - ./ml:/app/ml

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "app.jobs.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://nearhome:nearhome@postgres:5432/nearhome
      REDIS_URL: redis://redis:6379/0
      JOB_EXECUTION_MODE: arq
      FAIR_PRICE_MODEL_ARTIFACT_PATH: /app/model-artifacts/fair-price
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Keep local worker reference data in sync with the API without an image rebuild.
      - ./apps/api:/app/apps/api
      - ./data_pipeline:/app/data_pipeline
      - ./ml:/app/ml

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_DEPLOYMENT_ENV: ${NEXT_PUBLIC_DEPLOYMENT_ENV:-development}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_DEPLOYMENT_ENV: ${NEXT_PUBLIC_DEPLOYMENT_ENV:-development}
      NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
